<div class="auth-page">
    <div class="bg"></div>

    <div class="logo">
        <mat-icon class="logo-icon">movie</mat-icon>
        <span class="logo-text">MovieSceen</span>
    </div>

    <mat-card class="auth-card" appearance="outlined">
        <h1>Forgot Password</h1>
        <p class="subtitle">Enter your email address to receive password reset instructions from the email</p>

        <form [formGroup]="forgotPassword" (ngSubmit)="submit()" class="form">
            <mat-form-field appearance="outline" class="field">
                <mat-label>Email address</mat-label>
                <input matInput type="email" formControlName="email" />
                <mat-icon matPrefix>email</mat-icon>

                <mat-error *ngIf="forgotPassword.get('email')?.hasError('required')">
                    Email is required.
                </mat-error>
                <mat-error *ngIf="forgotPassword.get('email')?.hasError('email') && forgotPassword.get('email')?.touched">
                    Please enter a valid email address.
                </mat-error>
            </mat-form-field>

            <button mat-flat-button color="primary" class="sign-in-btn" type="submit"
                [disabled]="loading || forgotPassword.invalid">
                {{ loading ? 'Sending...' : 'Send Reset Link' }}
            </button>

            <div class="back-to-login">
                <span>Remembered your password?</span>
                <a routerLink="/login" class="link">Sign In</a>
            </div>
        </form>
        </mat-card>
        </div>
