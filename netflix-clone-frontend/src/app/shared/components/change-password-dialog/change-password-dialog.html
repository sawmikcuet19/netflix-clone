<div class="dialog-container">
    <div class="dialog-header">
        <h2>Change Password</h2>
    </div>
    <div class="dialog-content">
        <form [formGroup]="changePasswordForm" (ngSubmit)="submit()" class="password-form">
            <div class="form-section">
                <h2 class="section-title">
                    <mat-icon>lock</mat-icon>
                    Security Information
                </h2>

                <div class="form-grid">
                    <mat-form-field appearance="outline">
                        <input matInput placeholder="Current Password" type="password" formControlName="currentPassword" [type]="hideCurrent ? 'password' : 'text'">
                        <button type="button" mat-icon-button matSuffix (click)="hideCurrent = !hideCurrent">
                            <mat-icon>{{ hideCurrent ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                        <mat-error *ngIf="changePasswordForm.get('currentPassword')?.hasError('required')">
                            Current password is required
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <input matInput placeholder="New Password" type="password" formControlName="newPassword" [type]="hideNew ? 'password' : 'text'">
                        <button type="button" mat-icon-button matSuffix (click)="hideNew = !hideNew">
                            <mat-icon>{{ hideNew ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                        <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('required')">
                            New password is required
                        </mat-error>
                        <mat-error *ngIf="changePasswordForm.get('newPassword')?.hasError('minlength')">
                            New password must be at least 6 characters long
                        </mat-error>
                    </mat-form-field>

                    <mat-form-field appearance="outline">
                        <input matInput placeholder="Confirm New Password" type="password" formControlName="confirmNewPassword" [type]="hideConfirm ? 'password' : 'text'">
                        <button type="button" mat-icon-button matSuffix (click)="hideConfirm = !hideConfirm">
                            <mat-icon>{{ hideConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
                        </button>
                        <mat-error *ngIf="changePasswordForm.get('confirmNewPassword')?.hasError('required')">
                            Please confirm your new password
                        </mat-error>
                    </mat-form-field>
                </div>
            </div>
        </form>
    </div>
    <div class="dialog-footer">
        <button mat-button (click)="cancel()" [disabled]="loading" class="footer-cancel">Cancel</button>
        <button mat-raised-button color="primary" (click)="submit()" [disabled]="changePasswordForm.invalid || loading" class="footer-save">
            <mat-icon>{{loading ? 'hourglass_empty' : 'key'}}</mat-icon>
            <span>{{loading ? 'Changing...' : 'Change Password'}}</span>
        </button>
    </div>
</div>
