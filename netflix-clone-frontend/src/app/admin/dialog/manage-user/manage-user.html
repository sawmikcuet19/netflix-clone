<div class="dialog-container">
    <div class="dialog-header">
        <h1 class="">{{isEditMode ? 'Edit User': 'Create new User'}}</h1>

    </div>

    <div class="dialog-content">
        <form [formGroup]="userForm" class="createform">
            <div class="form-section">
                <h2 class="section-title">
                    <mat-icon>person</mat-icon>
                    {{isEditMode ? 'Edit Information': 'User Information'}}
                </h2>

                <div class="form-grid">
                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Full Name</mat-label>
                        <input matInput formControlName="fullName" placeholder="Enter Full Name">
                        <mat-icon matPrefix>badge</mat-icon>
                        <mat-error *ngIf="userForm.get('fullName')?.hasError('required')">Full name required</mat-error>
                    </mat-form-field>

                    <ng-container *ngIf="!isEditMode">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Email</mat-label>
                            <input matInput type="email" formControlName="email" placeholder="Enter Email">
                            <mat-icon matPrefix>email</mat-icon>
                            <mat-error *ngIf="userForm.get('email')?.hasError('required')">Email required</mat-error>
                            <mat-error *ngIf="userForm.get('email')?.hasError('email')">Valid Email required</mat-error>
                        </mat-form-field>
                    </ng-container>

                    <ng-container *ngIf="!isEditMode">
                        <mat-form-field appearance="outline" class="full-width">
                            <mat-label>Password</mat-label>
                            <input matInput type="hidePassword ? 'password': 'text'" formControlName="password"
                                placeholder="Enter Password">
                            <mat-icon matPrefix>lock</mat-icon>
                            <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword"
                                tabIndex="-1">
                                <mat-icon>{{hidePassword ? 'visibility_off': 'visibility'}}</mat-icon>
                            </button>
                            <mat-error *ngIf="userForm.get('password')?.hasError('required')">Password
                                required</mat-error>
                            <mat-error *ngIf="userForm.get('password')?.hasError('minLength')">Min 6 ch
                                required</mat-error>
                        </mat-form-field>
                    </ng-container>

                    <mat-form-field appearance="outline" class="full-width">
                        <mat-label>Role</mat-label>
                        <mat-select formControlName="role">
                            <mat-option value="USER">USER</mat-option>
                            <mat-option value="ADMIN">ADMIN</mat-option>
                        </mat-select>
                        <mat-icon matPrefix>admin_panel_settings</mat-icon>

                    </mat-form-field>
                </div>
            </div>
        </form>
    </div>

    <div class="dialog-footer">
        <button mat-button (click)="onCancel()" class="footer-cancel">Cancel</button>
        <button mat-raised-button color="primary" (click)="onSave()" [disabled]="!userForm.valid || creating"
            class="footer-save">
            <mat-icon>
                {{ creating ? 'hourglass_empty' : (isEditMode ? 'save' : 'person_add') }}
            </mat-icon>
            {{creating ? (isEditMode ? 'Saving...' : 'Creating...') : (isEditMode ? 'Saving Changes' : 'Create User')}}
        </button>
    </div>
</div>
