<div class="auth-page">
    <div class="bg"></div>
    <div class="logo">
        <mat-icon class="logo-icon">movie</mat-icon>
        <span class="logo-text">MovieSceen</span>
    </div>

    <mat-card class="auth-card" appearance="outlined">
        <div class="loading-container" *ngIf="loading">
            <mat-spinner diameter="50"></mat-spinner>
            <h2 class="">Verifying Email...</h2>
        </div>

        <div class="success-container" *ngIf="!loading && success">
            <mat-icon class="success-icon">check_circle</mat-icon>
            <h2>Email Verified Successfully!</h2>
            <p class="message">{{message}}</p>
            <button mat-flat-button class="action-btn" routerLink="/login">Go to Login</button>
        </div>

        <div class="error-container" *ngIf="!loading && !success">
            <mat-icon class="error-icon">error_outline</mat-icon>
            <h2>Email Verification Failed</h2>
            <p class="message">{{message}}</p>
            <div class="actions">
                <button mat-flat-button class="action-btn" routerLink="/login">Go to Login</button>
                <p class="resend-info">You can resend the verification email from the login page.</p>
            </div>
        </div>
    </mat-card>
</div>
